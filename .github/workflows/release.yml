# Release: builds every asset twice and compares, runs the macOS binary on a Mac, attests the build
# provenance, then creates the tag v<version> and a DRAFT release with the assets. A person publishes the draft.
# How to run it and how to verify a release: docs/release.md.
name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without "v": the tool own version (internal/cli VersionString, e.g. 0.1.0-preview.3), or x.y.z-rehearsal.N'
        required: true
        type: string
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: read
env:
  VERSION: ${{ inputs.version }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8' # exactly the version of installer/stub-386.version (docs/installer.md §6)
          cache: false # a release build starts from nothing
      - name: version and tag
        run: |
          go run ./tools/release -version "$VERSION" -check
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION exists already"; exit 1
          fi
      - name: gofmt, vet, test
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "not gofmt-formatted:"; echo "$out"; exit 1; fi
          go vet ./...
          go test ./...
      - name: committed installer stub is built from this source
        run: |
          go run ./tools/buildstub
          git diff --exit-code --stat -- installer/stub-386.exe installer/stub-386.version
      - name: build twice and compare (reproducible build)
        run: |
          go run ./tools/release -version "$VERSION" -o "$RUNNER_TEMP/dist"
          # The second build: another folder, an empty build cache.
          mkdir "$RUNNER_TEMP/src2"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/src2"
          (cd "$RUNNER_TEMP/src2" && GOCACHE="$RUNNER_TEMP/gocache2" go run ./tools/release -version "$VERSION" -o "$RUNNER_TEMP/dist2" >/dev/null)
          diff -r "$RUNNER_TEMP/dist" "$RUNNER_TEMP/dist2"
          echo "two builds identical:" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/    /' "$RUNNER_TEMP/dist/SHA256SUMS" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error

  # The universal macOS binary is written in Go on Linux (tools/release/macho.go); this job runs it on a Mac: lipo
  # names both slices, the arm64 slice's signature verifies, and the binary prints the version (natively on arm64, and
  # on x86-64 through Rosetta 2 when the runner has it).
  macos:
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: run the universal binary
        run: |
          mkdir m && tar -xzf "dist/yakbd-macos.tar.gz" -C m
          ls -l m
          lipo -archs m/yakbd | tee archs.txt
          grep -qw x86_64 archs.txt && grep -qw arm64 archs.txt
          lipo m/yakbd -verify_arch x86_64 arm64
          lipo m/yakbd -detailed_info
          codesign --verify --verbose --arch arm64 m/yakbd
          test "$(m/yakbd version)" = "yakbd $VERSION"
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            test "$(arch -x86_64 m/yakbd version)" = "yakbd $VERSION"
            echo "x86_64 slice ran through Rosetta 2" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Rosetta 2 is not available on this runner: the x86_64 slice was not run"
          fi
          echo "macOS: $(sw_vers -productVersion), $(uname -m): yakbd $VERSION from the universal binary" >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: [build, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the tag and the draft release
      id-token: write # attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: SHA256SUMS
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | LC_ALL=C sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: attest build provenance
        uses: actions/attest-build-provenance@v4
        # Artifact attestations need a public repository on GitHub's Free plan; the private prototype tries and goes on.
        continue-on-error: ${{ github.event.repository.private }}
        with:
          subject-path: 'dist/*'
      - name: tag and draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/v$VERSION"
          # A preview (x.y.z-preview.N) is a normal release, not a pre-release: the repository page does not show a
          # pre-release as its release. A rehearsal and any other suffix stay pre-releases. The latest mark is
          # given when the draft is published (gh release edit --draft=false --latest, docs/release.md §2).
          mark=""
          case "$VERSION" in *-rehearsal.*) mark="--prerelease" ;; *-preview.*) ;; *-*) mark="--prerelease" ;; esac
          # Short notes (docs/release.md §2): what's new lives on the site; the maintainer adds one or two lines
          # at the top before publishing.
          dl="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/latest/download"
          notes="What's new: https://yakbd.github.io/releases

          Downloads: [yakbd-cli-setup.exe]($dl/yakbd-cli-setup.exe) (Windows), [yakbd-linux-amd64.tar.gz]($dl/yakbd-linux-amd64.tar.gz), [yakbd-linux-arm64.tar.gz]($dl/yakbd-linux-arm64.tar.gz) (Linux), [yakbd-macos.tar.gz]($dl/yakbd-macos.tar.gz) (macOS). Install: https://yakbd.github.io/guide/

          Check a download with \`SHA256SUMS\` and its build attestation (https://yakbd.github.io/cli/release); releases are not code-signed (https://yakbd.github.io/guide/code-signing-policy)."
          gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --draft $mark --verify-tag \
            --title "yakbd $VERSION" \
            --notes "$notes"
