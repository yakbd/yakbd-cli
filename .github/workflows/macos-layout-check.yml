# macOS layout check: installs the keyboard-layout bundles of tools/macos-check/cases on GitHub's Mac runners,
# selects each one and checks it with UCKeyTranslate and by typing key codes (tools/macos-check/README.md).
# Manual only; it costs nothing until someone runs it.
name: macos-layout-check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
        place: [user, system]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8' # builds yakbd for the cases generated from a .kbl.json (README.md)
      - name: check
        env:
          MACOS_CHECK_PLACE: ${{ matrix.place }}
        run: tools/macos-check/run.sh "$RUNNER_TEMP/macos-check"
      - name: summary
        if: always()
        run: |
          { echo "### ${{ matrix.os }}, ${{ matrix.place }}"; echo '```'; cat "$RUNNER_TEMP/macos-check/summary.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-check-${{ matrix.os }}-${{ matrix.place }}
          path: |
            ${{ runner.temp }}/macos-check/summary.txt
            ${{ runner.temp }}/macos-check/build.txt
            ${{ runner.temp }}/macos-check/build-yakbd.txt
            ${{ runner.temp }}/macos-check/cases/
            ${{ runner.temp }}/macos-check/stderr.txt
            ${{ runner.temp }}/macos-check/log.txt
            ${{ runner.temp }}/macos-check/hitoolbox.txt
          if-no-files-found: ignore
